services:
  - type: web
    name: pokrovskiy-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: BITRIX24_WEBHOOK_URL
        sync: false
      - key: BITRIX24_LEAD_SOURCE
        value: WEBSITE

  - type: web
    name: pokrovskiy-site
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
